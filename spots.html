<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><title>Chongqing City — Spots</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head><body>
<main class="shell">
  <header class="page-header"><div class="page-label">Places</div><h1 class="page-title">SPOTS</h1><p class="page-sub">일정에 들어간 장소 모음입니다.</p></header>
  <div class="filter-row" id="filters"></div>
  <section class="grid-two" id="grid"></section>
</main>
<div id="nav"></div>
<script src="data.js"></script><script src="app.js"></script>
<script>
const entries=Object.entries(SPOTS);let filter='ALL';const filters=['ALL','CHONGQING','WULONG'];
function region(v){return v.area.startsWith('우롱')?'WULONG':'CHONGQING'}
function renderFilters(){document.getElementById('filters').innerHTML=filters.map(x=>`<button class="filter ${filter===x?'active':''}" data-f="${x}">${x}</button>`).join('');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderFilters();render()})}
function render(){document.getElementById('grid').innerHTML=entries.filter(([,v])=>filter==='ALL'||region(v)===filter).map(([id,v],i)=>`<a class="tile ${colorClass(i,1)}" href="${detailUrl('spot',id)}"><span class="chip">${v.kind}</span><div class="title">${v.name}</div><div class="caption">${v.cn}<br>${v.area}</div><div class="meta">${v.date}</div><div class="go">→</div></a>`).join('')}
renderFilters();render();document.getElementById('nav').innerHTML=nav('spots');
</script>
</body></html>
