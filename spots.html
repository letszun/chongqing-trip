<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c84236"><title>Chongqing City — Spots</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header class="page-header"><div class="eyebrow">Places</div><h1 class="page-title">SPOTS</h1><p class="page-sub">일정에 들어간 장소만 모았습니다. 누르면 상세 정보를 볼 수 있습니다.</p></header><div class="filter-row" id="filters"></div><div class="list" id="list"></div></main><div id="nav"></div><script src="data.js"></script><script src="app.js"></script><script>
const entries=Object.entries(SPOTS);let filter='ALL';const filters=['ALL','CHONGQING','WULONG'];
function region(v){return v.area.startsWith('우롱')?'WULONG':'CHONGQING'}
function renderFilters(){document.getElementById('filters').innerHTML=filters.map(x=>`<button class="filter ${filter===x?'active':''}" data-f="${x}">${x}</button>`).join('');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderFilters();render()})}
function render(){document.getElementById('list').innerHTML=entries.filter(([,v])=>filter==='ALL'||region(v)===filter).map(([id,v])=>`<a class="list-item" href="${detailUrl('spot',id)}"><div><div class="list-meta">${v.date} · ${v.kind}</div><div class="list-title">${v.name}</div><div class="list-cn">${v.cn} · ${v.area}</div></div><div class="chev">›</div></a>`).join('')}
renderFilters();render();document.getElementById('nav').innerHTML=nav('spots');
</script></body></html>
