<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><title>Chongqing City — Money</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head><body>
<main class="shell">
  <header class="page-header"><div class="page-label">Budget · 2 people</div><h1 class="page-title">MONEY</h1></header>
  <section class="money-hero"><div class="label">Total local budget</div><div class="number" id="total">0 <small>CNY</small></div><div style="font-size:13px;color:rgba(255,255,255,.74)">항공·숙소 제외 기준</div></section>
  <section class="grid-two">
    <div class="input-card color-yellow"><label>Base / person</label><input id="base" inputmode="numeric" value="1800"></div>
    <div class="input-card color-blue"><label>Shopping / person</label><input id="shop" inputmode="numeric" value="250"></div>
  </section>
  <div class="stack">
    <div class="info-chip color-violet"><span>우롱 관광지 · 공연 제외</span><b>≈ 310 / person</b></div>
    <div class="info-chip color-mint"><span>충칭↔우롱 고속철</span><b>≈ 150 / person</b></div>
    <div class="info-chip color-peach"><span>식비·간식</span><b>≈ 600—800 / person</b></div>
    <div class="info-chip color-sand"><span>교통·디디</span><b>≈ 180—300 / person</b></div>
  </div>
  <div class="note-card"><label>Expense notes</label><textarea id="notes" placeholder="8/27 카오위 186위안 / 둘이 반반"></textarea></div>
</main>
<div id="nav"></div>
<script src="data.js"></script><script src="app.js"></script>
<script>
const b=document.getElementById('base'),s=document.getElementById('shop'),n=document.getElementById('notes');b.value=state.ppBudget??1800;s.value=state.shopBudget??250;n.value=state.expenseNotes||'';function calc(){const t=(Number(b.value||0)+Number(s.value||0))*2;document.getElementById('total').innerHTML=`${t.toLocaleString()} <small>CNY</small>`;state.ppBudget=Number(b.value||0);state.shopBudget=Number(s.value||0);save()}b.oninput=calc;s.oninput=calc;n.oninput=()=>{state.expenseNotes=n.value;save()};calc();document.getElementById('nav').innerHTML=nav('money');
</script>
</body></html>
