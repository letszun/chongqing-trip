<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c84236"><title>Chongqing City — Talk</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header class="page-header"><div class="eyebrow">Chinese</div><h1 class="page-title">TALK</h1><p class="page-sub">화면을 보여주거나 COPY를 눌러 사용하세요.</p></header><div id="phrases"></div></main><div id="nav"></div><script src="data.js"></script><script src="app.js"></script><script>
