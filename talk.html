<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><title>Chongqing City — Talk</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head><body>
<main class="shell">
  <header class="page-header"><div class="page-label">Useful Chinese</div><h1 class="page-title">TALK</h1><p class="page-sub">눌러서 복사하거나 화면을 보여주세요.</p></header>
  <section class="talk-grid" id="phrases"></section>
</main>
<div id="nav"></div>
<script src="data.js"></script><script src="app.js"></script>
<script>
document.getElementById('phrases').innerHTML=PHRASES.map(([ko,zh],i)=>`<section class="chat-card ${colorClass(i,3)}"><div class="ko">${ko}</div><div class="zh">${zh}</div><button class="copy" data-copy="${esc(zh)}">COPY</button></section>`).join('');document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(b.dataset.copy));document.getElementById('nav').innerHTML=nav('talk');
</script>
</body></html>
