<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><title>Chongqing City — Eat</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head><body>
<main class="shell">
  <header class="page-header"><div class="page-label">Food & Drink</div><h1 class="page-title">EAT</h1><p class="page-sub">먹고 싶은 메뉴와 주문용 표현 정리입니다.</p></header>
  <section class="grid-two" id="grid"></section>
</main>
<div id="nav"></div>
<script src="data.js"></script><script src="app.js"></script>
<script>
document.getElementById('grid').innerHTML=Object.entries(FOODS).map(([id,v],i)=>`<a class="tile ${colorClass(i,2)}" href="${detailUrl('food',id)}"><span class="chip">${v.kind}</span><div class="title">${v.name}</div><div class="caption">${v.cn}</div><div class="meta">${v.date}</div><div class="go">→</div></a>`).join('');
document.getElementById('nav').innerHTML=nav('eat');
</script>
</body></html>
