function renderCheck(){document.getElementById('check').innerHTML=`<header class="pagehead"><div class="kicker">Before departure</div><h1>CHECK</h1></header><div class="checkgrid">${CHECKS.map((x,i)=>`<label class="check ${state['c'+i]?'done':''} ${i%2?color(i+3):''}" id="check${i}"><input type="checkbox" ${state['c'+i]?'checked':''} onchange="toggleCheck(${i},this.checked)"><span class="ctext">${x}</span></label>`).join('')}</div><div class="note"><label>Notes</label><textarea id="freeNote" placeholder="예약번호, 숙소 주소, 살 것">${esc(state.freeNote||'')}</textarea></div>`;document.getElementById('freeNote').oninput=e=>{state.freeNote=e.target.value;save()}}
function toggleCheck(i,v){state['c'+i]=v;save();document.getElementById('check'+i).classList.toggle('done',v)}
function renderDetail(type,id,from){const obj=type==='food'?FOODS[id]:SPOTS[id];if(!obj){go('plan');return}const idx=Object.keys(type==='food'?FOODS:SPOTS).indexOf(id);const bullets=type==='food'?obj.order:obj.highlights;const photo=photoFor(type,id);document.getElementById('detail').innerHTML=`<div class="detailwrap"><button class="back" onclick="go('${from||'plan'}')">← BACK</button><div class="detailposter ${color(idx+2)}"><div class="detailposter-top"><div><div class="dtype">${obj.kind}</div><div class="dname">${obj.name}</div><div class="dcn">${obj.cn}</div><div class="dtags"><span>${obj.date}</span>${obj.area?`<span>${obj.area}</span>`:''}${obj.duration?`<span>${obj.duration}</span>`:''}</div></div><div><div class="detailphoto-wrap"><div class="detailphoto-shape"><img class="detailphoto" src="${photo}" alt="${obj.name} 대표 이미지" loading="eager" referrerpolicy="no-referrer" onerror="this.style.display='none';this.parentElement.classList.add('fallback')"></div></div><div class="detailcaption">${obj.name}</div></div></div></div><section class="section"><h2>About</h2><p>${obj.summary}</p></section><section class="section"><h2>${type==='food'?'Order':'Highlights'}</h2><ul>${(bullets||[]).map(x=>`<li>${x}</li>`).join('')}</ul></section><section class="section"><h2>Note</h2><ul>${(obj.tips||[]).map(x=>`<li>${x}</li>`).join('')}</ul></section><div class="actions"><button class="action" onclick="copyText('${esc(obj.search||obj.cn)}')">검색어 복사</button><button class="action" onclick="copyText('${esc(obj.cn)}')">중국어명 복사</button></div></div>`}
function route(){const h=(location.hash||'#plan').slice(1);const parts=h.split('/');if(parts[0]==='detail'){renderDetail(parts[1],parts[2],parts[3]);show('detail');nav(parts[3]||'plan');return}const page=['plan','spots','eat','money','talk','check'].includes(parts[0])?parts[0]:'plan';if(page==='plan')renderPlan();if(page==='spots')renderSpots();if(page==='eat')renderEat();if(page==='money')renderMoney();if(page==='talk')renderTalk();if(page==='check')renderCheck();show(page);nav(page)}
window.addEventListener('hashchange',route);route();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{}));
</script>
</body>
</html>
