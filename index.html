<head>

<title>Chongqing City</title>

<style>
@import url('https://cdn.jsdelivr.net/npm/pretendard/dist/web/static/pretendard.css');
:root{
  /* Reference palette: CHARCOAL / WARM GREEN / SAGE / GREY / LIME */
  --charcoal:#2E2D2D;
  --warm-green:#ACB77A;
  --sage:#D1E2BE;
  --grey:#F8F7F2;
  --lime:#E8F985;
  --bg:var(--grey);
  --paper:var(--grey);
  --ink:var(--charcoal);
  --muted:rgba(46,45,45,.62);
  --line:rgba(46,45,45,.10);
  /* Legacy color tokens remapped so the existing layout/logic stays untouched. */
  --red:var(--charcoal);
  --yellow:var(--lime);
  --blue:var(--warm-green);
  --lav:var(--sage);
  --pink:var(--lime);
  --mint:var(--sage);
  --sand:var(--grey);
  --black:var(--charcoal);
  --white:var(--grey);
  --shadow:0 14px 34px rgba(46,45,45,.10);
  --r-xl:34px;
  --r-lg:28px;
  --r-md:22px;
  --english:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--grey);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;letter-spacing:-.02em}
button,input,textarea,select{font:inherit}
button{border:0;background:none;cursor:pointer}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
.app{width:min(100%,780px);margin:0 auto;min-height:100vh;padding:0 18px 120px}
.view{display:none}.view.active{display:block}
.page-top{padding:calc(22px + env(safe-area-inset-top)) 0 16px}
.kicker{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.en-title,.big-en,.nav-label,.chip,.mini-title{font-family:var(--english)}
.hero-title{margin:8px 0 0;font-family:var(--english);font-size:clamp(42px,11vw,74px);line-height:.88;letter-spacing:-.07em;font-weight:900}
.hero-sub{margin:10px 0 0;font-size:13px;line-height:1.55;color:var(--muted)}
.pills{display:flex;gap:8px;overflow:auto;padding:14px 0 2px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pill{flex:none;background:var(--white);padding:9px 12px;border-radius:999px;box-shadow:var(--shadow);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.banner{margin-top:16px;background:var(--black);color:var(--white);padding:22px;border-radius:34px;box-shadow:var(--shadow)}
.banner small{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(248,247,242,.70)}
.banner strong{display:block;font-family:var(--english);font-size:30px;line-height:.95;letter-spacing:-.05em;margin-top:10px}
.banner p{margin:10px 0 0;font-size:12px;line-height:1.55;color:rgba(255,255,255,.72)}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.section-top{padding:calc(22px + env(safe-area-inset-top)) 0 12px}
.section-title{margin:0;font-family:var(--english);font-size:clamp(38px,10vw,62px);line-height:.92;letter-spacing:-.06em;font-weight:900}
.section-sub{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.55}
.filters{display:flex;gap:8px;overflow:auto;padding:12px 0 6px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.filter{flex:none;background:var(--white);border-radius:999px;padding:10px 13px;box-shadow:var(--shadow);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.filter.active{background:var(--black);color:var(--white)}
.card{position:relative;border-radius:var(--r-xl);padding:18px;box-shadow:var(--shadow);overflow:hidden}
.color-red{background:var(--red);color:var(--grey)}.color-yellow{background:var(--yellow)}.color-blue{background:var(--blue)}.color-lav{background:var(--lav)}.color-pink{background:var(--pink)}.color-mint{background:var(--mint)}.color-sand{background:var(--sand)}.color-black{background:var(--black);color:var(--grey)}.color-white{background:var(--white)}
.day-card .head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.day-card .day-no{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.day-card .day-title{font-family:var(--english);font-size:clamp(28px,8vw,42px);line-height:.92;letter-spacing:-.05em;font-weight:900;margin-top:6px}
.day-card .day-place{font-size:11px;font-weight:700;opacity:.74;margin-top:8px}
.day-card .date-box{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.day-card .date-box b{font-size:18px;letter-spacing:-.04em}.day-card .date-box span{display:inline-flex;padding:6px 9px;border-radius:999px;background:rgba(248,247,242,.68);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.color-red .date-box span,.color-black .date-box span{background:rgba(248,247,242,.18);color:var(--grey)}
.events{display:grid;gap:9px;margin-top:16px}

.booking-list,.talk-list,.check-list,.maybe-list,.expense-list{display:grid;gap:12px;margin-top:14px}
.booking{padding:16px;border-radius:26px;box-shadow:var(--shadow)}

.booking .title{font-family:var(--english);font-size:24px;line-height:.95;letter-spacing:-.05em;font-weight:900;margin-top:10px}

.detail-memo{width:100%;min-height:100px;border:0;outline:0;resize:vertical;background:var(--grey);border-radius:18px;padding:13px 14px;font-size:13px;line-height:1.6;color:var(--ink)}

.input-card{padding:16px;border-radius:26px;box-shadow:var(--shadow)}

.info-list{display:grid;gap:10px;margin-top:14px}.info-chip{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 16px;border-radius:22px;box-shadow:var(--shadow);font-size:12px;font-weight:800}.info-chip b{font-size:13px}

.note-card textarea{width:100%;min-height:108px;border:0;outline:0;resize:vertical;background:transparent;line-height:1.6}

.task{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:flex-start;padding:16px;border-radius:24px;box-shadow:var(--shadow);background:var(--white)}

.maybe-card{padding:16px;border-radius:28px;box-shadow:var(--shadow)}
.maybe-card .type{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.72}.maybe-card .title{font-family:var(--english);font-size:24px;line-height:.95;letter-spacing:-.05em;font-weight:900;margin-top:10px}.maybe-card .sub{font-size:12px;line-height:1.55;margin-top:8px}
.detail-top{padding:calc(20px + env(safe-area-inset-top)) 0 16px}.back{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:999px;background:var(--grey);box-shadow:var(--shadow);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.detail-card{margin-top:14px;padding:20px;border-radius:34px;box-shadow:var(--shadow)}
.detail-card .type{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.detail-card .name{font-family:var(--english);font-size:clamp(38px,10vw,66px);line-height:.9;letter-spacing:-.06em;font-weight:900;margin-top:10px}
.detail-card .cn{font-size:17px;font-weight:700;opacity:.75;margin-top:7px}
.detail-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.detail-tags span{display:inline-flex;padding:8px 10px;border-radius:999px;background:rgba(248,247,242,.72);font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.photo-shell{margin-top:16px;display:grid;gap:10px}
.photo-frame{width:min(100%,460px);aspect-ratio:1.16/1;margin:0 auto;background:rgba(255,255,255,.42);box-shadow:0 16px 28px rgba(0,0,0,.08);overflow:hidden}

.detail-caption{text-align:center;font-size:10px;font-weight:800;opacity:.64}

/* v9 UX overrides */
body{font-size:16px}
.section-title{font-family:var(--english);font-size:clamp(36px,10vw,56px);font-weight:900;letter-spacing:-.06em;line-height:.94}
.section-top.compact{padding-top:8px}

.readable-body{min-width:0}.readable-title{font-size:19px;font-weight:850;line-height:1.2;letter-spacing:-.035em}.readable-sub{margin-top:5px;font-size:12px;color:rgba(46,45,45,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.readable-meta{margin-top:5px;font-size:11px;color:var(--muted);font-weight:700}.readable-arrow{font-size:28px;line-height:1;color:rgba(46,45,45,.58);text-align:center}
.filters{padding-top:8px}.filter{min-height:42px;font-family:"Pretendard",sans-serif;font-size:12px;letter-spacing:-.01em;text-transform:none}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.more-card{position:relative;min-height:150px;text-align:left;padding:18px 16px;border-radius:28px;box-shadow:var(--shadow);color:var(--ink)}.more-title{margin-top:0;font-family:var(--english);font-size:20px;font-weight:900;line-height:1.05;letter-spacing:-.03em}.more-sub{margin-top:8px;padding-right:22px;font-size:12px;line-height:1.45;color:rgba(46,45,45,.72)}.more-arrow{position:absolute;right:16px;bottom:14px;width:28px;height:28px;border-radius:50%;background:rgba(248,247,242,.62);display:grid;place-items:center;font-size:16px;font-weight:900}
.quick-btn{min-height:108px}.quick-btn strong{font-family:var(--english);font-size:21px;letter-spacing:-.04em}.quick-btn .mini-title{font-family:var(--english)}
.detail-card .name{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;letter-spacing:-.045em;line-height:1;font-size:clamp(34px,10vw,58px)}
.detail-card .cn{line-height:1.5}
.event,.tile,.readable-row,.more-card,.quick-btn,.action-btn,.inline-btn,.filter,.back,.secondary-back button{touch-action:manipulation}
.action-btn,.inline-btn{min-height:44px}.action-row{gap:8px}.action-row .action-btn{flex:1 1 auto}
.booking-list,.talk-list,.check-list,.maybe-list,.expense-list{gap:10px}
.booking .title{font-family:"Pretendard",sans-serif;font-size:21px;letter-spacing:-.035em}.booking .type,.booking .code{font-family:var(--english)}
.maybe-card .title{font-family:"Pretendard",sans-serif;font-size:21px;letter-spacing:-.035em}.maybe-card .type{font-family:var(--english)}
.today-card .big-title{font-family:"Pretendard",sans-serif;letter-spacing:-.04em;line-height:1.03}.today-card .big-num{font-family:var(--english)}
.weather-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.weather-card{padding:18px;border-radius:28px;box-shadow:var(--shadow)}.weather-name{font-size:14px;font-weight:850}.weather-temp{font-family:var(--english);font-size:56px;font-weight:900;letter-spacing:-.07em;line-height:.95;margin-top:10px}.weather-desc{font-size:12px;line-height:1.5;margin-top:9px}.weather-updated{grid-column:1/-1;text-align:right;color:var(--muted);font-size:11px}
.status-card,.notice-card{margin-top:14px;background:var(--grey);border-radius:24px;padding:16px;box-shadow:var(--shadow);font-size:13px;line-height:1.55}.notice-card b,.notice-card span{display:block}.notice-card span{margin-top:6px;color:var(--muted)}
.emergency-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.emergency-card{min-height:110px;border-radius:26px;padding:15px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between}.emergency-card span{font-size:13px;font-weight:800}.emergency-card strong{font-family:var(--english);font-size:34px;letter-spacing:-.06em}

.catalog-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.catalog-card{position:relative;aspect-ratio:1/1;width:100%;min-width:0;text-align:left;padding:15px;border-radius:28px;box-shadow:var(--shadow);overflow:hidden;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start}
.catalog-card .catalog-chip{display:inline-flex;align-items:center;min-height:28px;padding:6px 9px;border-radius:999px;background:rgba(248,247,242,.72);font-family:var(--english);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.catalog-card .catalog-name{margin-top:16px;font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;font-size:clamp(18px,5.2vw,24px);font-weight:850;line-height:1.12;letter-spacing:-.04em;word-break:keep-all}
.catalog-card .catalog-cn{margin-top:7px;font-size:11px;font-weight:700;line-height:1.35;color:rgba(46,45,45,.82);word-break:break-all}
.catalog-card .catalog-en{margin-top:3px;font-family:var(--english);font-size:10px;line-height:1.3;color:rgba(17,17,17,.58);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.catalog-card .catalog-meta{margin-top:auto;padding-top:10px;font-size:10px;font-weight:750;color:rgba(46,45,45,.78)}
.catalog-card .catalog-arrow{position:absolute;right:13px;bottom:12px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(46,45,45,.96);color:var(--grey);font-size:17px;font-weight:900}
.catalog-card.visited .catalog-chip:before{content:'✓ ';}

@media(max-width:560px){.more-grid{grid-template-columns:1fr 1fr}.weather-grid{grid-template-columns:1fr 1fr}.emergency-grid{grid-template-columns:repeat(3,1fr)}.section-sub{max-width:36ch}.app{padding-left:16px;padding-right:16px}.readable-row{padding:11px}.readable-title{font-size:18px}.readable-sub{font-size:11.5px}}

</style>
</head>
<body>
<div class="app">
  <section id="today" class="view"></section>
  <section id="plan" class="view"></section>
  <section id="spots" class="view"></section>
  <section id="eat" class="view"></section>
  <section id="book" class="view"></section>
  <section id="money" class="view"></section>
  <section id="talk" class="view"></section>
  <section id="check" class="view"></section>
  <section id="maybe" class="view"></section>
  <section id="more" class="view"></section>
  <section id="weather" class="view"></section>
  <section id="emergency" class="view"></section>
  <section id="detail" class="view"></section>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>
<div class="toast" id="toast">COPIED</div>
<script>
const COLORS=['color-red','color-yellow','color-blue','color-lav','color-pink','color-mint','color-sand'];
const MASKS=['mask-a','mask-b','mask-c'];
const SPOT_KO={jiefangbei:'해방비',hongyadong:'홍야동',bayi:'바이이 하오츠제',tmpgov:'대한민국 임시정부 청사',tiansheng:'천생삼교',fairymountain:'선녀산',longshuixia:'용수협지봉',guanyinqiao:'관음교',jiujie:'구가',luohansi:'나한사',ciqikou:'자기구고진',liziba:'리즈바역',ering:'어링얼창',shibati:'십팔제',xiahao:'샤하오리'};
const FOOD_KO={milktea:'밀크티',yangrou:'우롱 양고기',kaoyu:'카오위',xiaomian:'충칭 샤오몐',xiaolongxia:'마라롱샤',dimsum:'딤섬'};
const MORE_ITEMS=[
  {id:'book',icon:'booking',title:'BOOKINGS',sub:'항공·기차·숙소·입장권'},
  {id:'money',icon:'wallet',title:'MONEY',sub:'예산과 커플 공동지출'},
  {id:'talk',icon:'chat',title:'TALK',sub:'중국어 문장 복사'},
  {id:'check',icon:'check',title:'CHECK',sub:'예약·결제·준비물'},
  {id:'maybe',icon:'star',title:'MAYBE',sub:'시간 남으면 갈 곳'},
  {id:'weather',icon:'cloud',title:'WEATHER',sub:'충칭·우롱 날씨와 운영 확인'},
  {id:'emergency',icon:'emergency',title:'EMERGENCY',sub:'긴급전화와 도움 요청 문장'}
];
function nav(current){
  const group=['book','money','talk','check','maybe','weather','emergency'].includes(current)?'more':current;
  const items=[['today','◎','TODAY'],['plan','◷','PLAN'],['spots','⌖','SPOTS'],['eat','✦','EAT'],['more','•••','MORE']];
  document.getElementById('bottomNav').innerHTML=items.map(([id,icon,label])=>`<button class="nav-btn ${group===id?'active':''}" aria-label="${label}" onclick="go('${id}')"><i>${icon}</i><span class="nav-label">${label}</span></button>`).join('');
}

function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
function go(id){location.hash=id}
function openDetail(type,id,from){location.hash=`detail/${type}/${id}/${from||'plan'}`}
function toggleVisited(type,id){const key=type==='spot'?'visitedSpots':'visitedFoods';state[key]=state[key]||{};state[key][id]=!state[key][id];save();route()}
function isVisited(type,id){const key=type==='spot'?'visitedSpots':'visitedFoods';return !!(state[key]&&state[key][id])}
function mapLinks(query){const q=encodeURIComponent(query);return {amap:`https://uri.amap.com/search?keyword=${q}&view=map&src=chongqing-trip&callnative=1`,google:`https://www.google.com/maps/search/?api=1&query=${q}`}}
function getTodayData(){const now=new Date();const start=new Date('2026-08-25T00:00:00');const end=new Date('2026-08-29T23:59:59');
  if(now < start){const diff=Math.ceil((start-now)/(1000*60*60*24));return {mode:'countdown',label:`D-${diff}`,title:'여행 준비',day:DAYS[0],subtitle:'여행 전 준비 단계'};}
  if(now > end){return {mode:'done',label:'DONE',title:'여행 종료',day:DAYS[DAYS.length-1],subtitle:'여행 종료'};}
  const idx=Math.min(DAYS.length-1,Math.max(0,Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-new Date(2026,7,25))/(1000*60*60*24))));
  return {mode:'during',label:`DAY ${idx+1}`,title:DAYS[idx].name,day:DAYS[idx],subtitle:DAYS[idx].place};
}
function nextEventForDay(day){const now=new Date();const hh=String(now.getHours()).padStart(2,'0');const mm=String(now.getMinutes()).padStart(2,'0');const current=`${hh}:${mm}`;const timed=day.events.filter(e=>/^\d{2}:\d{2}$/.test(e[0]));return timed.find(e=>e[0]>=current)||timed[timed.length-1]||day.events[0]}
function renderToday(){const t=getTodayData();const day=t.day;const next= t.mode==='during'?nextEventForDay(day):day.events[0];const nextFood=day.events.find(e=>e[3]==='food');
 document.getElementById('today').innerHTML=`<div class="page-top"><div class="kicker">Live view</div><h1 class="section-title">TODAY</h1></div><div class="today-hero"><div class="today-card ${t.mode==='during'?'color-red':'color-black'}"><div class="tiny">Status</div><div class="big-num">${t.label}</div><div class="big-title">${t.title}</div><div class="info">${t.subtitle}<br>${day.date} · ${day.dow} · ${day.sleep}</div></div><div class="today-card color-white"><div class="tiny">Next up</div><div class="big-title">${next[1]}</div><div class="info">${next[0]} · ${next[2]||''}<br>Food: ${nextFood?nextFood[1]:day.food}</div><div class="action-row"><button class="action-btn light" onclick="go('plan')">일정 열기</button><button class="action-btn light" onclick="go('book')">예약 열기</button></div></div></div><div class="quick-links"><button class="quick-btn color-yellow" onclick="go('book')"><div class="mini-title">Travel</div><strong class="en-title">BOOKINGS</strong><p>항공·숙소·기차 보기</p></button><button class="quick-btn color-blue" onclick="go('talk')"><div class="mini-title">Useful</div><strong class="en-title">TALK</strong><p>중국어 표현 바로 복사</p></button><button class="quick-btn color-pink" onclick="go('money')"><div class="mini-title">Budget</div><strong class="en-title">SPLIT</strong><p>공동지출·정산 확인</p></button><button class="quick-btn color-mint" onclick="go('maybe')"><div class="mini-title">Options</div><strong class="en-title">MAYBE</strong><p>후보 장소·식당 보기</p></button></div><div class="banner"><small>Today route</small><strong>${day.name}</strong><p>${day.events.map(e=>`${e[0]} ${e[1]}`).join(' · ')}</p></div>`;
}
function renderPlan(){document.getElementById('plan').innerHTML=`<div class="page-top"><div class="kicker">Chongqing · Wulong · Aug 25–29</div><h1 class="hero-title en-title">CHONGQING<br>CITY</h1><div class="pills"><span class="pill">2 PEOPLE</span><span class="pill">4 NIGHTS · 5 DAYS</span><span class="pill">CITY + WULONG</span></div><div class="banner"><small>Main route</small><strong>City → Wulong → City</strong><p>일정 속 장소와 음식은 눌러서 상세 정보를 볼 수 있습니다.</p></div></div><div class="grid day-grid">${DAYS.map((d,i)=>`<article class="card day-card ${color(i)}"><div class="head"><div><div class="day-no en-title">DAY ${String(i+1).padStart(2,'0')}</div><div class="day-title en-title">${d.name}</div><div class="day-place">${d.place}</div></div><div class="date-box"><b>${d.date}</b><span>${d.dow}</span></div></div><div class="events">${d.events.map(e=>{const [time,title,sub,type,id]=e;return type?`<button class="event clickable" onclick="openDetail('${type}','${id}','plan')"><div class="time">${time}</div><div><div class="title">${title}</div><div class="sub">${sub||''}</div></div></button>`:`<div class="event"><div class="time">${time}</div><div><div class="title">${title}</div><div class="sub">${sub||''}</div></div></div>`}).join('')}</div></article>`).join('')}</div>`}
function renderSpots(filter='ALL'){
  const entries=Object.entries(SPOTS).filter(([,v])=>filter==='ALL'||(filter==='WULONG'?v.area==='우롱':v.area!=='우롱'));
  document.getElementById('spots').innerHTML=`<div class="section-top"><div class="kicker">PLACES</div><h1 class="section-title">SPOTS</h1></div><div class="filters">${[['ALL','ALL'],['CHONGQING','CHONGQING'],['WULONG','WULONG']].map(([f,label])=>`<button class="filter ${filter===f?'active':''}" onclick="renderSpots('${f}')">${label}</button>`).join('')}</div><div class="catalog-grid">${entries.map(([id,v],i)=>`<button class="catalog-card ${color(i+1)} ${isVisited('spot',id)?'visited':''}" onclick="openDetail('spot','${id}','spots')"><span class="catalog-chip">${v.kind}</span><div class="catalog-name">${SPOT_KO[id]||v.name}</div><div class="catalog-cn">${v.cn}</div><div class="catalog-en">${v.name}</div><div class="catalog-meta">${v.area} · ${v.date}${isVisited('spot',id)?' · 방문 완료':''}</div><div class="catalog-arrow">→</div></button>`).join('')}</div>`
}

function renderEat(){
  document.getElementById('eat').innerHTML=`<div class="section-top"><div class="kicker">FOOD & DRINK</div><h1 class="section-title">EAT</h1></div><div class="catalog-grid">${Object.entries(FOODS).map(([id,v],i)=>`<button class="catalog-card ${color(i+2)} ${isVisited('food',id)?'visited':''}" onclick="openDetail('food','${id}','eat')"><span class="catalog-chip">${v.kind}</span><div class="catalog-name">${FOOD_KO[id]||v.name}</div><div class="catalog-cn">${v.cn}</div><div class="catalog-en">${v.name}</div><div class="catalog-meta">${v.date}${isVisited('food',id)?' · 먹음':''}</div><div class="catalog-arrow">→</div></button>`).join('')}</div>`
}

function bookingPlaceholder(type){if(type==='Flight')return '편명, 터미널, 체크인 시간, 좌석, 환승 메모 등';if(type==='Train')return '열차번호, 출발·도착시간, 좌석, 역 출입구 등';if(type==='Hotel')return '중국어 주소, 전화번호, 체크인 시간, 예약번호 등';if(type==='Ticket')return '예약번호, 입장시간, QR/수령 방법 등';return '주소, 시간, 예약번호 등 필요한 정보를 적어두세요.'}
function saveBookingMemo(i,v){state.bookingMemos=state.bookingMemos||{};state.bookingMemos[i]=v;save()}
function saveDetailMemo(type,id,v){state.detailMemos=state.detailMemos||{spot:{},food:{}};state.detailMemos[type]=state.detailMemos[type]||{};state.detailMemos[type][id]=v;save()}
function detailMemo(type,id){return (((state.detailMemos||{})[type]||{})[id])||''}
function renderBook(){document.getElementById('book').innerHTML=`<div class="secondary-back"><button onclick="go('more')">← 더보기</button></div><div class="section-top compact"><div class="kicker">Flights · Trains · Hotels</div><h1 class="section-title">BOOKINGS</h1><p class="section-sub">예약 정보와 직접 적는 메모를 한곳에 모았습니다.</p></div><div class="booking-list">${BOOKINGS.map((b,i)=>`<article class="booking ${b.color||color(i)}"><div class="row"><div><div class="type en-title">${b.type}</div><div class="title en-title">${b.title}</div></div><div class="code en-title">${b.code}</div></div><div class="meta">${b.meta.map(x=>`• ${x}`).join('<br>')}</div><div class="meta" style="margin-top:8px;font-weight:700">${b.note}</div><div class="booking-memo"><label>MY MEMO</label><textarea placeholder="${bookingPlaceholder(b.type)}" oninput="saveBookingMemo(${i},this.value)">${esc((state.bookingMemos||{})[i]||'')}</textarea></div></article>`).join('')}</div>`}
function calcSplit(){const total=(Number(state.base||0)+Number(state.shop||0))*2;const items=state.splitItems||[];const jy=items.filter(x=>x.payer==='지윤').reduce((a,b)=>a+Number(b.amount||0),0);const bf=items.filter(x=>x.payer==='남자친구').reduce((a,b)=>a+Number(b.amount||0),0);const paidTotal=jy+bf;const half=paidTotal/2;let settlement='아직 정산 없음';if(paidTotal>0){if(jy>half) settlement=`남자친구 → 지윤 ${Math.round((jy-half)*100)/100}元`; else if(bf>half) settlement=`지윤 → 남자친구 ${Math.round((bf-half)*100)/100}元`; else settlement='딱 반반'}return {total,jy,bf,paidTotal,settlement}}
function addSplit(){const item=document.getElementById('splitItem').value.trim();const amount=Number(document.getElementById('splitAmount').value||0);const payer=document.getElementById('splitPayer').value;if(!item||!amount)return toast('ITEM & AMOUNT');state.splitItems=state.splitItems||[];state.splitItems.unshift({id:Date.now(),item,amount,payer});save();renderMoney();toast('ADDED')}
function removeSplit(id){state.splitItems=(state.splitItems||[]).filter(x=>x.id!==id);save();renderMoney()}
function renderMoney(){const split=calcSplit();document.getElementById('money').innerHTML=`<div class="secondary-back"><button onclick="go('more')">← 더보기</button></div><div class="section-top compact"><div class="kicker">Budget · Couple split</div><h1 class="section-title">MONEY</h1></div><div class="money-total"><div class="tiny">Local budget target</div><div class="num en-title">${split.total.toLocaleString()} <small>CNY</small></div><div style="font-size:12px;color:rgba(248,247,242,.72)">항공·숙소 제외</div></div><div class="input-grid"><div class="input-card color-yellow"><label>Base / person</label><input id="base" inputmode="numeric" value="${state.base||1800}"></div><div class="input-card color-blue"><label>Shopping / person</label><input id="shop" inputmode="numeric" value="${state.shop||250}"></div></div><div class="info-list"><div class="info-chip color-lav"><span>우롱 관광지 · 공연 제외</span><b>≈ 310 / 인</b></div><div class="info-chip color-mint"><span>충칭↔우롱 고속철</span><b>≈ 150 / 인</b></div><div class="info-chip color-pink"><span>현재 공동지출 합계</span><b>${split.paidTotal.toLocaleString()}元</b></div><div class="info-chip color-sand"><span>현재 정산</span><b>${split.settlement}</b></div></div><div class="note-card"><label>Expense notes</label><textarea id="expenseNote" placeholder="8/27 카오위 186위안 / 둘이 반반">${esc(state.expenseNote||'')}</textarea></div><div class="section-top" style="padding-top:18px"><div class="kicker">COUPLE SPLIT</div><h1 class="section-title" style="font-size:30px">SPLIT</h1></div><div class="input-grid"><div class="input-card color-white"><label>Item</label><input id="splitItem" placeholder="카오위" style="font-size:22px;font-family:inherit;font-weight:700"></div><div class="input-card color-white"><label>Amount</label><input id="splitAmount" inputmode="numeric" placeholder="186"></div><div class="input-card select color-white"><label>Payer</label><select id="splitPayer"><option>지윤</option><option>남자친구</option></select></div><div class="input-card color-red" style="display:flex;align-items:flex-end;justify-content:center"><button class="inline-btn" onclick="addSplit()">지출 추가</button></div></div><div class="booking-list" style="margin-top:14px"><div class="info-chip color-yellow"><span>지윤 결제</span><b>${split.jy.toLocaleString()}元</b></div><div class="info-chip color-blue"><span>남자친구 결제</span><b>${split.bf.toLocaleString()}元</b></div></div><div class="expense-list">${(state.splitItems||[]).map((x,i)=>`<div class="expense-item ${color(i+1)}"><div class="left"><b>${esc(x.item)}</b><span>${x.payer}</span></div><div class="right"><strong>${Number(x.amount).toLocaleString()}元</strong><button onclick="removeSplit(${x.id})">삭제</button></div></div>`).join('')||'<div class="note-card">아직 입력한 공동지출이 없습니다.</div>'}</div>`;
 const updateTarget=()=>{const el=document.querySelector('#money .money-total .num');if(el)el.innerHTML=`${((Number(state.base||0)+Number(state.shop||0))*2).toLocaleString()} <small>CNY</small>`};document.getElementById('base').oninput=e=>{state.base=Number(e.target.value||0);save();updateTarget()};document.getElementById('shop').oninput=e=>{state.shop=Number(e.target.value||0);save();updateTarget()};document.getElementById('expenseNote').oninput=e=>{state.expenseNote=e.target.value;save()};}
function phraseCategory(i){if(i<=4)return 'HOTEL';if(i<=10)return 'MOVE';if(i<=19)return 'FOOD';if(i<=25)return 'PAY';return 'ETC'}
function renderTalk(filter='ALL'){const labels=[['ALL','전체'],['HOTEL','숙소'],['MOVE','이동'],['FOOD','식당'],['PAY','결제'],['ETC','기타']];const rows=PHRASES.map((p,i)=>({p,i,cat:phraseCategory(i)})).filter(x=>filter==='ALL'||x.cat===filter);document.getElementById('talk').innerHTML=`<div class="secondary-back"><button onclick="go('more')">← 더보기</button></div><div class="section-top compact"><div class="kicker">USEFUL CHINESE</div><h1 class="section-title">TALK</h1><p class="section-sub">상황별로 골라서 복사하면 됩니다.</p></div><div class="filters">${labels.map(([v,l])=>`<button class="filter ${filter===v?'active':''}" onclick="renderTalk('${v}')">${l}</button>`).join('')}</div><div class="talk-list">${rows.map(({p:[ko,zh],i})=>`<div class="talk-card ${color(i+2)}"><div class="ko">${ko}</div><div class="zh">${zh}</div><button class="inline-btn" onclick="copyText('${esc(zh)}')">복사</button></div>`).join('')}</div>`}

function renderCheck(){document.getElementById('check').innerHTML=`<div class="secondary-back"><button onclick="go('more')">← 더보기</button></div><div class="section-top compact"><div class="kicker">Before departure</div><h1 class="section-title">CHECK</h1></div><div class="check-list">${CHECKS.map((t,i)=>`<label class="task ${state['check'+i]?'done':''}"><input type="checkbox" ${state['check'+i]?'checked':''} onchange="state['check${i}']=this.checked;save();renderCheck()"><span class="txt">${t}</span></label>`).join('')}</div><div class="note-card"><label>Notes</label><textarea id="freeNote" placeholder="예약번호, 숙소 주소, 살 것">${esc(state.freeNote||'')}</textarea></div>`;document.getElementById('freeNote').oninput=e=>{state.freeNote=e.target.value;save()}}
function renderMaybe(){document.getElementById('maybe').innerHTML=`<div class="secondary-back"><button onclick="go('more')">← 더보기</button></div><div class="section-top compact"><div class="kicker">Extra options</div><h1 class="section-title">MAYBE</h1><p class="section-sub">시간이 남을 때 넣을 후보들.</p></div><div class="maybe-list">${MAYBE.map((m,i)=>`<article class="maybe-card ${color(i+3)}"><div class="type en-title">${m.type}</div><div class="title">${m.title}</div><div class="sub">${m.cn}<br>${m.why}<br><b>${m.when}</b></div></article>`).join('')}</div>`}
function renderDetail(type,id,from){const data=type==='food'?FOODS[id]:SPOTS[id];if(!data){go('plan');return}const idx=Object.keys(type==='food'?FOODS:SPOTS).indexOf(id);const links=mapLinks(data.map||data.search||data.cn);const isFood=type==='food';const bullets=isFood?data.order:data.highlights;const visited=isVisited(type,id);const koName=isFood?(FOOD_KO[id]||data.name):(SPOT_KO[id]||data.name);const memoPlaceholder=isFood?'식당명, 주소, 예약시간, 전화번호, 주문할 메뉴 등을 적어두세요.':'주소, 입장시간, 티켓, 교통·만남 장소 등을 적어두세요.';
 document.getElementById('detail').innerHTML=`<div class="detail-top"><button class="back" onclick="go('${from||'plan'}')">← Back</button><div class="detail-card ${color(idx+1)}"><div class="type en-title">${data.kind}</div><div class="name">${koName}</div><div class="cn">${data.cn} · <span class="en-title">${data.name}</span></div><div class="detail-tags"><span>${data.date}</span>${data.area?`<span>${data.area}</span>`:''}${data.duration?`<span>${data.duration}</span>`:''}</div><div class="photo-shell"><div class="photo-frame ${mask(idx)}" id="photoFrame"><img src="${data.photo}" alt="${data.name}" referrerpolicy="no-referrer" onerror="this.remove();document.getElementById('photoFrame').classList.add('fallback');document.getElementById('photoFrame').textContent='PHOTO';"></div><div class="detail-caption">Representative image</div></div></div><div class="action-row"><button class="action-btn light" onclick="toggleVisited('${type}','${id}')">${visited?'표시 해제':'방문 완료'}</button><button class="action-btn" onclick="copyText('${esc(data.cn)}')">중국어명 복사</button><button class="action-btn" onclick="copyText('${esc(data.search||data.cn)}')">검색어 복사</button></div><div class="action-row"><a class="action-btn light" href="${links.amap}" target="_blank" rel="noopener">高德地图</a><a class="action-btn light" href="${links.google}" target="_blank" rel="noopener">Google Maps</a></div><div class="map-note">중국 현지에서는 高德地图를 우선 사용하고, Google Maps는 보조 링크로 두었습니다.</div><section class="detail-section"><h3>About</h3><p>${data.summary}</p></section><section class="detail-section"><h3>${isFood?'Order':'Highlights'}</h3><ul>${(bullets||[]).map(x=>`<li>${x}</li>`).join('')}</ul></section><section class="detail-section"><h3>MY MEMO</h3><textarea class="detail-memo" placeholder="${memoPlaceholder}" oninput="saveDetailMemo('${type}','${id}',this.value)">${esc(detailMemo(type,id))}</textarea></section><section class="detail-section"><h3>Note</h3><ul>${(data.tips||[]).map(x=>`<li>${x}</li>`).join('')}</ul></section></div>`}
function weatherText(code){if(code===0)return '맑음';if([1,2,3].includes(code))return '구름';if([45,48].includes(code))return '안개';if([51,53,55,56,57].includes(code))return '이슬비';if([61,63,65,66,67,80,81,82].includes(code))return '비';if([71,73,75,77,85,86].includes(code))return '눈';if([95,96,99].includes(code))return '뇌우';return '확인 필요'}
async function loadWeather(force=false){const root=document.getElementById('weatherCards');if(!root)return;const cached=state.weatherCache;const fresh=cached&&Date.now()-cached.time<30*60*1000;if(cached&&!force){renderWeatherCards(cached);if(fresh)return}root.innerHTML='<div class="status-card">날씨 불러오는 중…</div>';try{const urls=[['충칭',29.563,106.5516],['우롱',29.325,107.76]];const rows=[];for(const [name,lat,lon] of urls){const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,precipitation,weather_code&timezone=Asia%2FShanghai`;const r=await fetch(u);if(!r.ok)throw new Error('weather');const j=await r.json();rows.push({name,...j.current})}state.weatherCache={time:Date.now(),rows};save();renderWeatherCards(state.weatherCache)}catch(e){root.innerHTML='<div class="status-card"><b>날씨를 불러오지 못했습니다.</b><br><span>인터넷 연결 후 다시 시도하세요. 캐시된 값이 있으면 마지막 값이 표시됩니다.</span></div>';if(cached)renderWeatherCards(cached)}}
function renderWeatherCards(cache){const root=document.getElementById('weatherCards');if(!root)return;root.innerHTML=cache.rows.map((w,i)=>`<article class="weather-card ${color(i+1)}"><div class="weather-name">${w.name}</div><div class="weather-temp">${Math.round(w.temperature_2m)}°</div><div class="weather-desc">${weatherText(w.weather_code)} · 체감 ${Math.round(w.apparent_temperature)}° · 강수 ${w.precipitation||0} mm</div></article>`).join('')+`<div class="weather-updated">마지막 확인: ${new Date(cache.time).toLocaleString('ko-KR')}</div>`}
function renderWeather(){document.getElementById('weather').innerHTML=`<div class="secondary-back"><button onclick="go('more')">← 더보기</button></div><div class="section-top compact"><div class="kicker">WEATHER · WULONG STATUS</div><h1 class="section-title">WEATHER</h1><p class="section-sub">온라인일 때 최신 날씨를 불러옵니다. 우롱 관광지 운영 여부는 공식 페이지에서 마지막으로 확인하세요.</p></div><div id="weatherCards" class="weather-grid"></div><div class="action-row"><button class="action-btn" onclick="loadWeather(true)">날씨 새로고침</button><a class="action-btn light" href="https://www.wlkst.com/" target="_blank" rel="noopener">우롱 공식 관광</a></div><div class="notice-card"><b>우롱 체크</b><span>천생삼교 · 용수협지봉 · 선녀산은 폭우 시 운영이 바뀔 수 있습니다. 출발 직전 공지를 우선 확인하세요.</span></div>`;loadWeather(false)}
function renderEmergency(){document.getElementById('emergency').innerHTML=`<div class="secondary-back"><button onclick="go('more')">← 더보기</button></div><div class="section-top compact"><div class="kicker">EMERGENCY</div><h1 class="section-title">EMERGENCY</h1><p class="section-sub">급할 때 바로 누르거나 복사할 정보만 모았습니다.</p></div><div class="emergency-grid"><a class="emergency-card color-red" href="tel:110"><span>경찰</span><strong>110</strong></a><a class="emergency-card color-yellow" href="tel:120"><span>구급</span><strong>120</strong></a><a class="emergency-card color-blue" href="tel:119"><span>소방</span><strong>119</strong></a></div><div class="talk-list"><div class="talk-card color-white"><div class="ko">도와주세요.</div><div class="zh">请帮帮我。</div><button class="inline-btn" onclick="copyText('请帮帮我。')">복사</button></div><div class="talk-card color-pink"><div class="ko">병원에 가야 해요.</div><div class="zh">我需要去医院。</div><button class="inline-btn" onclick="copyText('我需要去医院。')">복사</button></div><div class="talk-card color-mint"><div class="ko">경찰을 불러주세요.</div><div class="zh">请帮我报警。</div><button class="inline-btn" onclick="copyText('请帮我报警。')">복사</button></div></div><div class="notice-card"><b>민감정보</b><span>여권번호·카드번호 같은 정보는 이 앱 메모에 저장하지 않는 것을 권장합니다.</span></div>`}
function renderMore(){
  document.getElementById('more').innerHTML=`<div class="section-top"><div class="kicker">TRIP TOOLS</div><h1 class="section-title">MORE</h1><p class="section-sub">여행 중 자주 쓰는 보조 기능을 한곳에 모았습니다.</p></div><div class="more-grid">${MORE_ITEMS.map((m,i)=>`<button class="more-card ${color(i+1)}" onclick="go('${m.id}')"><div class="more-title">${m.title}</div><div class="more-sub">${m.sub}</div><div class="more-arrow">→</div></button>`).join('')}</div>`
}
function route(){const hash=(location.hash||'#today').slice(1);const p=hash.split('/');if(p[0]==='detail'){renderDetail(p[1],p[2],p[3]);show('detail');nav(p[3]||'plan');return}
  const view=['today','plan','spots','eat','book','money','talk','check','maybe','more','weather','emergency'].includes(p[0])?p[0]:'today';
  if(view==='today') renderToday();
  if(view==='plan') renderPlan();
  if(view==='spots') renderSpots();
  if(view==='eat') renderEat();
  if(view==='book') renderBook();
  if(view==='money') renderMoney();
  if(view==='talk') renderTalk();
  if(view==='check') renderCheck();
  if(view==='maybe') renderMaybe();
  if(view==='more') renderMore();
  if(view==='weather') renderWeather();
  if(view==='emergency') renderEmergency();
  show(view); nav(view);
}
window.addEventListener('hashchange',route); route();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{}));
</script>
</body>
</html>
