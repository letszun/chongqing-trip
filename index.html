<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c84236"><title>Chongqing City — Plan</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head><body>
<main class="shell"><header class="app-header"><h1 class="app-title">CHONGQING<br><span>CITY</span></h1><div class="app-meta">AUG 25—29<br>CHONGQING · WULONG</div></header><div id="days"></div></main><div id="nav"></div><script src="data.js"></script><script src="app.js"></script><script>
const wrap=document.getElementById('days');
wrap.innerHTML=DAYS.map((d,di)=>`<section class="day"><div class="day-head"><div class="day-date">${d.date}<small>${d.dow} · DAY ${String(di+1).padStart(2,'0')}</small></div><div><div class="day-name">${d.name}</div><div class="day-place">${d.place}</div></div></div><div class="timeline">${d.events.map(e=>`<div class="event"><div class="event-time">${e.time}</div><div class="event-main">${e.type?`<a class="event-link" href="${detailUrl(e.type,e.id)}"><div class="event-title">${e.title}</div><div class="event-sub">${e.sub}</div></a>`:`<div class="event-title">${e.title}</div><div class="event-sub">${e.sub}</div>`}</div>${e.type?`<div class="event-type">${e.type}</div>`:''}</div>`).join('')}</div></section>`).join('');
document.getElementById('nav').innerHTML=nav('plan');
</script></body></html>
